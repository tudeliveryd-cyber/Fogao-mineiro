:root{--ac:#B45309;--ac2:#92400E;--ink:#15130F;--mute:#5B5650;--line:#E8E3DC;--bg:#FFFFFF;--soft:#F7F4EF;--hf:'Fraunces',Georgia,serif;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--hf);line-height:1.1;letter-spacing:-.015em}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* topo */
.top{position:fixed;inset:0 0 auto;z-index:20;transition:background .25s,box-shadow .25s;color:#fff}
.top.solid{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;min-width:0}
.brand .mk{width:38px;height:38px;border-radius:11px;background:var(--ac);color:#fff;display:grid;place-items:center;font-family:var(--hf);font-size:16px;flex:none;overflow:hidden}
.brand .mk img{width:100%;height:100%;object-fit:cover}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:22px;margin-left:auto;font-size:14.5px;font-weight:500}
.nav a{opacity:.86}.nav a:hover{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;border:1.5px solid transparent;cursor:pointer;transition:transform .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac2)}
.btn.ghost{border-color:rgba(255,255,255,.6);color:#fff;background:rgba(255,255,255,.08)}.btn.ghost:hover{background:rgba(255,255,255,.18)}
.btn.line{border-color:var(--line);background:#fff;color:var(--ink)}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.top .btn.sm{margin-left:4px}
/* hero */
.hero{position:relative;min-height:min(92vh,820px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#222}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.03)}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.72) 100%)}
.hero .wrap{position:relative;z-index:2;padding-top:120px;padding-bottom:72px;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(40px,7.4vw,84px);margin:18px 0 14px;max-width:14ch}
.hero p.tag{font-size:clamp(17px,2.1vw,21px);max-width:44ch;opacity:.92}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .open{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:14.5px;opacity:.92}
.dot{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.25)}
.dot.off{background:#F87171;box-shadow:0 0 0 4px rgba(248,113,113,.25)}

section{padding:88px 0}
.kick{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
h2{font-size:clamp(30px,4.2vw,46px);margin:10px 0 16px}
.lead{color:var(--mute);font-size:17px;max-width:60ch}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.about .txt p{color:var(--mute);font-size:17px;white-space:pre-line}
.about .pic{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;background:var(--soft)}

.about .panel b{font-family:var(--hf);font-size:28px;line-height:1.15}
.svc{background:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:34px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:14px}
.card .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ac)}
.card b{font-size:17px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:zoom-in;background:var(--soft)}
.gal img:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto;height:100%}
.info{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px}
.box{border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px}
.box h3{font-family:'Inter',sans-serif;font-size:17px;display:flex;align-items:center;gap:10px;letter-spacing:0}
.box h3 svg{color:var(--ac)}
.hours{white-space:pre-line;color:var(--mute)}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);color:var(--mute)}
.hrow:last-child{border:0}
.hrow b{color:var(--ink);font-weight:600}
.map{border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:var(--soft)}
.map iframe{width:100%;height:100%;border:0}
.band{background:var(--ink);color:#fff;border-radius:28px;padding:56px;display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
.band h2{margin:0;color:#fff;max-width:18ch}
.band p{opacity:.75;margin-top:8px}
footer{padding:46px 0 110px;border-top:1px solid var(--line);margin-top:88px;font-size:14px;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer .soc{display:flex;gap:10px}
footer .soc a{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.by{display:inline-flex;align-items:center;gap:6px}.by a{color:var(--ink);font-weight:600}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.fab svg{width:32px;height:32px;fill:#fff}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}.lb img{max-height:90vh;border-radius:10px}

.state{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px;background:var(--soft)}
.state div{max-width:420px;display:flex;flex-direction:column;gap:12px;align-items:center}
.state h1{font-size:30px}.state p{color:var(--mute)}
.state small{margin-top:20px;color:var(--mute)}
.sk{min-height:100vh;background:linear-gradient(90deg,#eee 0%,#f6f6f6 50%,#eee 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.sk{animation:none}}
@media (max-width:900px){.nav{display:none}.about{grid-template-columns:1fr;gap:30px}.about .pic,.about .panel{aspect-ratio:16/11}.info{grid-template-columns:1fr}.band{padding:36px 26px}}
@media (max-width:560px){section{padding:64px 0}.hero .wrap{padding-bottom:48px}.hero .btn{flex:1 1 100%}.gal{grid-template-columns:1fr 1fr}.top .btn.sm span{display:none}.top .btn.sm{width:40px;padding:0}.band .btn{width:100%}}
</style>
