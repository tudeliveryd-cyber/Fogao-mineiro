<!doctype html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1714">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel Fogão">
<meta name="robots" content="noindex">
<script>window.TDC_MODE='panel'</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fogão Mineiro · Panel del local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: plataforma (barra Tu Delivery) envolvendo um catálogo-inquilino com tema próprio; painel em duas colunas com pré-visualização ao vivo */
:root{
  --bg:#F4F3F2; --surface:#FFFFFF; --fg:#1B1817; --muted:#6E6866; --line:#E6E2E0; --soft:#EFECEA;
  --accent:#C2410C; --accent-ink:#FFFFFF; --ok:#15803D; --warn:#B45309; --bad:#B91C1C;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141211; --surface:#1E1B1A; --fg:#F2EEEC; --muted:#A39C99; --line:#332E2C; --soft:#272322;
  --accent:#F07A3E; --accent-ink:#1A0F08; --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141211; --surface:#1E1B1A; --fg:#F2EEEC; --muted:#A39C99; --line:#332E2C; --soft:#272322;
  --accent:#F07A3E; --accent-ink:#1A0F08; --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band,var(--surface))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- Barra da plataforma ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.spacer{flex:1}
.urlpill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:620px){.brand small,.urlpill{display:none}.seg button{padding:6px 9px}}

/* ---------- Catálogo (tema do inquilino) ---------- */
.catwrap{container-type:inline-size;background:var(--t-bg);color:var(--t-text);min-height:100%}
.chead{background:var(--t-header);color:var(--t-header-ink)}
.cover{position:relative;width:100%;aspect-ratio:16/6;max-height:320px;min-height:150px;overflow:hidden;background:var(--t-secondary)}
.cover.plain{aspect-ratio:auto;height:130px;min-height:0;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--t-primary) 55%,transparent) 0 14px,transparent 14px 26px),linear-gradient(var(--t-primary),color-mix(in srgb,var(--t-primary) 60%,var(--t-header)))}
.cover img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.cover::after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,var(--t-header))}
.chead-in{position:relative;z-index:1;max-width:1080px;margin:-52px auto 0;padding-block:0 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:16px;align-items:flex-end}
.chead-in .logo{width:96px;height:96px;border-radius:24px;border:4px solid var(--t-header);font-size:32px;box-shadow:0 6px 18px rgb(0 0 0 / .35)}
.cinfo{min-width:0;padding-bottom:4px}
.facts{max-width:1080px;margin:0 auto;padding-block:8px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;opacity:.85}
.facts span{display:inline-flex;align-items:center;gap:6px}
.chead .meta{margin-top:10px}
@container (max-width:520px){.chead-in{flex-direction:column;align-items:center;text-align:center;gap:10px;margin-top:-44px}.chead-in .logo{width:80px;height:80px;font-size:26px}}
.chead-in .logo:has(img){width:170px;height:112px;border-radius:20px}
@container (max-width:520px){.chead-in .logo:has(img){width:140px;height:92px}}
.pcard .pbadge{align-self:flex-start;background:var(--t-promo);color:var(--t-promo-ink);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.pcard.off .pbadge{background:color-mix(in srgb,var(--t-text) 75%,transparent);color:var(--t-bg)}
.fcard .ph.short{aspect-ratio:5/2}
.logo{width:68px;height:68px;border-radius:18px;flex:none;background:var(--t-primary);color:var(--t-primary-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px;overflow:hidden;border:3px solid color-mix(in srgb,var(--t-header-ink) 18%,transparent)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.logo:has(img){background:#fff}
.chead h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5cqi,32px);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.chead p{margin:4px 0 8px;opacity:.82;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--t-header-ink) 12%,transparent)}
.meta .open{background:var(--t-highlight);color:var(--t-highlight-ink)}
.cbody{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;display:flex;flex-direction:column;gap:18px}
.banner{background:var(--t-secondary);color:var(--t-secondary-ink);border-radius:var(--t-r2);padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:600}
.banner .tag{background:var(--t-promo);color:var(--t-promo-ink);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--t-card);border:1px solid color-mix(in srgb,var(--t-text) 12%,transparent);border-radius:var(--t-r);padding:10px 14px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--t-text)}
.search input::placeholder{color:color-mix(in srgb,var(--t-text) 50%,transparent)}
.cnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,0px));z-index:5;background:var(--t-bg);margin-inline:-4px;padding:6px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cnav::-webkit-scrollbar{display:none}
.cnav a{flex:none;text-decoration:none;color:var(--t-text);font-weight:600;font-size:14px;padding:8px 14px;border-radius:var(--t-r);background:var(--t-card);border:1px solid color-mix(in srgb,var(--t-text) 10%,transparent);display:flex;gap:6px;align-items:center}
.cnav a.on{background:var(--t-primary);color:var(--t-primary-ink);border-color:transparent}
.cnav.tabs{gap:2px;border-bottom:1px solid color-mix(in srgb,var(--t-text) 12%,transparent)}
.cnav.tabs a{background:transparent;border:0;border-radius:0;border-bottom:2px solid transparent}
.cnav.tabs a.on{background:transparent;color:var(--t-primary);border-bottom-color:var(--t-primary)}
.sech{font-family:var(--f-display);font-weight:800;font-size:20px;margin:6px 0 10px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;scroll-margin-top:70px}
.sech .ct{font-family:var(--f-body);font-size:12px;font-weight:600;opacity:.55}
.feat{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.fcard{flex:none;width:200px;background:var(--t-card);border-radius:var(--t-r2);overflow:hidden;border:1px solid color-mix(in srgb,var(--t-text) 8%,transparent);text-align:left;padding:0;color:var(--t-text)}
.fcard .ph{aspect-ratio:4/3}
.fcard .fx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@container (min-width:620px){.grid.g{grid-template-columns:repeat(2,1fr)}}
@container (min-width:900px){.grid.g{grid-template-columns:repeat(3,1fr)}.grid.l{grid-template-columns:repeat(2,1fr)}}
.pcard{background:var(--t-card);color:var(--t-text);border:1px solid color-mix(in srgb,var(--t-text) 8%,transparent);border-radius:var(--t-r2);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;position:relative;min-width:0}
.pcard .ph{aspect-ratio:16/10}
.pcard .px{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.grid.l .pcard{flex-direction:row-reverse;align-items:stretch}
.grid.l .pcard .ph{width:112px;aspect-ratio:auto;flex:none}
.pname{font-weight:700;font-size:15.5px;line-height:1.25}
.pdesc{font-size:13px;opacity:.68;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{color:var(--t-price);font-weight:700;font-variant-numeric:tabular-nums}
.old{text-decoration:line-through;opacity:.5;font-size:12.5px;margin-left:6px;color:var(--t-text);font-weight:500}
.addb{width:34px;height:34px;border-radius:var(--t-r);background:var(--t-button);color:var(--t-button-ink);display:grid;place-items:center;flex:none}
.ph{background:color-mix(in srgb,var(--t-primary) 13%,var(--t-card));color:var(--t-primary);display:grid;place-items:center;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ic{opacity:.75}
.badge{position:absolute;top:8px;left:8px;background:var(--t-promo);color:var(--t-promo-ink);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;z-index:1}
.pcard.off{opacity:.55}
.pcard.off .badge{background:color-mix(in srgb,var(--t-text) 80%,transparent);color:var(--t-bg)}
.empty{text-align:center;padding:30px 10px;opacity:.6}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--t-bg) 60%,transparent);pointer-events:none}
.cartbar button{pointer-events:auto;max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;border:0;background:var(--t-button);color:var(--t-button-ink);padding:14px 18px;border-radius:var(--t-r2);font-weight:700;box-shadow:0 8px 24px rgb(0 0 0 / .22)}
.cartbar .cnt{background:var(--t-button-ink);color:var(--t-button);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.cartbar .sp{flex:1;text-align:left}

/* ---------- Folha (modal) ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgb(10 8 7 / .5);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--t-bg,var(--surface));color:var(--t-text,var(--fg));width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease}
.sheet.admin{background:var(--surface);color:var(--fg)}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px;max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.ov,.sheet{animation:none}}
.sh-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;background:inherit;border-bottom:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.sh-top h2{font-family:var(--f-display);font-size:19px;margin:0;flex:1;font-weight:800;letter-spacing:-.01em}
.xbtn{width:36px;height:36px;border-radius:999px;border:0;background:color-mix(in srgb,currentColor 8%,transparent);display:grid;place-items:center}
.sh-body{padding:16px;display:flex;flex-direction:column;gap:16px}
.sh-foot{position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:inherit;border-top:1px solid color-mix(in srgb,currentColor 10%,transparent);display:flex;gap:10px;align-items:center}
.pbig{aspect-ratio:16/9;border-radius:14px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp-h b{font-size:15px}
.grp-h small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid color-mix(in srgb,currentColor 14%,transparent);border-radius:12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--t-primary,var(--accent));background:color-mix(in srgb,var(--t-primary,var(--accent)) 7%,transparent)}
.opt input{accent-color:var(--t-primary,var(--accent));width:18px;height:18px;margin:0}
.opt span{flex:1}
.opt em{font-style:normal;opacity:.7;font-variant-numeric:tabular-nums;font-size:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:12.5px;font-weight:600;opacity:.78}
.inp{width:100%;border:1px solid color-mix(in srgb,currentColor 18%,transparent);background:var(--t-card,var(--surface));border-radius:10px;padding:10px 12px;outline:0;min-width:0}
.inp:focus{border-color:var(--t-primary,var(--accent))}
textarea.inp{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.stepper{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,currentColor 16%,transparent);border-radius:999px}
.stepper button{width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center}
.stepper span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.btn-main{flex:1;border:0;background:var(--t-button,var(--accent));color:var(--t-button-ink,var(--accent-ink));padding:13px 16px;border-radius:var(--t-r,12px);font-weight:700;display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;text-align:center}
.btn-main[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{border:1px solid color-mix(in srgb,currentColor 20%,transparent);background:transparent;padding:11px 14px;border-radius:var(--t-r,12px);font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.citem{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.citem .ph{width:56px;height:56px;border-radius:10px;flex:none}
.citem .ci{flex:1;min-width:0}
.citem small{display:block;opacity:.65;font-size:12.5px}
.citem .warn{color:var(--bad);font-weight:600;opacity:1}
.tots{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.tots div{display:flex;justify-content:space-between}
.tots .tt{font-weight:800;font-size:18px;padding-top:6px;border-top:1px solid color-mix(in srgb,currentColor 12%,transparent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border:1.5px solid color-mix(in srgb,currentColor 14%,transparent);border-radius:14px;background:var(--t-card,var(--surface));text-align:left}
.mode b{font-size:15px}
.mode small{opacity:.65;font-size:12.5px}
.mode[aria-pressed="true"]{border-color:var(--t-primary);box-shadow:inset 0 0 0 1px var(--t-primary)}
.mode[aria-pressed="true"] .ic{color:var(--t-primary)}
.mode[disabled]{opacity:.4;cursor:not-allowed}
.sect{font-family:var(--f-display);font-size:16px;font-weight:800;margin:4px 0 -4px}
.info{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--t-primary,var(--accent)) 8%,transparent);font-size:14px}
.info.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-weight:600}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.msgbox{white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;background:var(--t-card,var(--soft));border:1px solid color-mix(in srgb,currentColor 12%,transparent);border-radius:12px;padding:12px;max-height:300px;overflow:auto;user-select:all}
.done-ic{width:56px;height:56px;border-radius:999px;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto}
.gpsb{display:flex;align-items:center;gap:8px;justify-content:center}

/* ---------- Painel ---------- */
.admin-wrap{max-width:1240px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.ahead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ahead .logo{width:44px;height:44px;border-radius:12px;font-size:16px;border:0}
.ahead h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em}
.ahead p{margin:0;color:var(--muted);font-size:13px}
.tabs-a{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs-a::-webkit-scrollbar{display:none}
.tabs-a button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-a button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:13px;margin:-6px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat small{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.custom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:920px){.custom{grid-template-columns:minmax(0,1fr)}}

function lineUnit(cfg,it){const p=prod(cfg,it.pid);if(!p)return 0;let v=eff(p);(p.g||[]).forEach(g=>{const ps=(it.o[g.id]||[]).map(oid=>g.o.find(x=>x.id===oid)).filter(Boolean).map(o=>+o.p||0);if(!ps.length)return;

 shifts(d).forEach(([a,b])=>{if(a<o.at)return;for(let m=Math.ceil((a+prep)/15)*15;m<=b-15&&out.length<24;m+=15)out.push(`${lb} ${hhmm(m)}`)});return out}

function grpRule(g,p,o){if(g.type==='one')return g.req?t('choose_one'):t('optional');const a=gMin(g),b=gMax(g,p,o);if(b&&a)return a===b?t('choose_upto').replace('{n}',b):t('choose_range').replace('{a}',a).replace('{b}',b);if(b)return t('choose_upto').replace('{n}',b);if(a)return t('choose_min').replace('{n}',a);return t('optional')}

function lineLabel(cfg,it,L){const p=prod(cfg,it.pid);if(!p)return'';const parts=[];const nm=o=>L?(o.n[L]||o.n.pt):tr(o.n);(p.g||[]).forEach(g=>{const names=(it.o[g.id]||[]).map(oid=>g.o.find(x=>x.id===oid)).filter(Boolean).map(nm);if(!names.length)return;parts.push(names.length>1?`${L?(g.n[L]||g.n.pt):tr(g.n)}: ${names.join(' / ')}`:names[0])});return parts}

function dist(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function slots(st){const now=new Date();const prep=+st.prep||0;const d=st.days[now.getDay()];const out=[];if(!d||!d.on)return out;
 const m0=now.getHours()*60+now.getMinutes()+prep;
 shifts(d).forEach(([a,b])=>{for(let m=Math.ceil(Math.max(m0,a+prep)/15)*15;m<=b-15&&out.length<20;m+=15)out.push(hhmm(m))});return out}
const DAYN={pt:['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],es:['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']};
function mins(x){if(!x)return null;const[h,m]=x.split(':').map(Number);return h*60+m}
function hhmm(m){return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function shifts(d){const r=[];[d.a,d.b].forEach(p=>{if(p&&p[0]&&p[1]){const a=mins(p[0]);let b=mins(p[1]);if(b<=a)b+=1440;r.push([a,b])}});return r}
function openState(st,now=new Date()){if(st.paused)return{open:false,paused:true};const days=st.days||defDays();const m=now.getHours()*60+now.getMinutes();const d=days[now.getDay()];
 if(d.on&&shifts(d).some(([a,b])=>m>=a&&m<b))return{open:true};
 for(let k=0;k<8;k++){const dw=(now.getDay()+k)%7,dd=days[dw];if(!dd.on)continue;const ss=shifts(dd).map(x=>x[0]).sort((a,b)=>a-b);for(const a of ss){if(k===0&&a<=m)continue;return{open:false,day:k,at:a,dow:dw}}}
 return{open:false}}

function todayHours(st){const d=(st.days||defDays())[new Date().getDay()];if(!d.on)return t('closed_today');return shifts(d).map(([a,b])=>hhmm(a)+'–'+hhmm(b)).join(' · ')}

 if(ck.mode==='delivery'){if(!ck.street.trim()||!ck.num.trim())ckErr.street=t('err_street');if(st.feeMode==='bairro'){if(!ck.bairro)ckErr.bairro=t('err_bairro');else if(!bairroFee())ckErr.bairro=t('err_out_bairro')}else{if(!ck.bairro.trim())ckErr.bairro=t('err_bairro');if(ck.zone==='')ckErr.zone=t('err_zone');else if(ck.zone==='out')ckErr.zone=t('err_out')}}
 if(ck.mode==='pickup'&&openState(st).open&&!ck.time)ckErr.time=t('err_time');

 if(!openState(st).open){if(canSched(st)){if(!ck.sched)ckErr.sched=t('err_sched')}else ckErr.closed=t('err_closed')}

 if(ck.mode==='pickup'&&openState(st).open&&!slots(st).length)ckErr.time=t('no_slots');
 return !Object.keys(ckErr).length}

  e.g=(e.g||[]).map(g=>({...g,n:{pt:g.n.pt.trim(),es:(g.n.es||g.n.pt).trim()},o:g.o.filter(o=>o.n.pt.trim()).map(o=>({...o,n:{pt:o.n.pt.trim(),es:(o.n.es||o.n.pt).trim()}}))})).filter(g=>g.n.pt&&g.o.length);const data=clone(e);delete data.isNew;
  applyBoth(c=>{const i=c.products.findIndex(p=>p.id===data.id);if(i<0)c.products.push(clone(data));else c.products[i]=clone(data)});closeSheet();render()},
 delprod(){const id=ui.edit.id;applyBoth(c=>c.products=c.products.filter(p=>p.id!==id));cart=cart.filter(i=>i.pid!==id);saveCart();closeSheet();render()},
 addzone(){const last=pub.zones[pub.zones.length-1]||{km:0,fee:0};applyBoth(c=>c.zones.push({name:'Zona '+(c.zones.length+1),km:+last.km+3,fee:+last.fee+3000}));render()},
 again(){const L=S.get(K.last,null);if(!L)return;let miss=false;L.items.forEach(it=>{if(cartOk(it))cart.push(clone(it));else miss=true});saveCart();render();cartSheet();if(miss)toast(t('repeat_some'),true)},
 applycoupon(){const code=(ck.couponIn||'').trim().toUpperCase().replace(/\s/g,'');const c=pub.store.coupons.find(x=>x.on&&x.code===code);delete ckErr.coupon;
  if(!c)ckErr.coupon=t('err_coupon');else if(subtotal()<(c.min||0))ckErr.coupon=`${t('err_coupon_min')} ${gs(c.min)}`;else{ck.coupon=code;ck.couponIn=code}checkoutSheet()},
 rmcoupon(){ck.coupon='';ck.couponIn='';checkoutSheet()},
 addgroup(){ui.edit.g.push({id:'g'+Date.now(),n:{pt:'',es:''},type:'one',req:false,o:[{id:'o'+Date.now(),n:{pt:'',es:''},p:0}]});editorSheet()},
 delgroup(el){ui.edit.g.splice(+el.dataset.gi,1);editorSheet()},
 addopt(el){ui.edit.g[+el.dataset.gi].o.push({id:'o'+Date.now(),n:{pt:'',es:''},p:0});editorSheet()},
 delopt(el){ui.edit.g[+el.dataset.gi].o.splice(+el.dataset.oi,1);editorSheet()},
 addcat(){const id='c'+Date.now();applyBoth(c=>c.cats.push({id,n:{pt:'Nova categoria',es:'Nueva categoría'},i:'box'}));render()},
 catmove(el){const i=+el.dataset.i,j=i+(+el.dataset.d);applyBoth(c=>{if(j<0||j>=c.cats.length)return;const x=c.cats[i];c.cats[i]=c.cats[j];c.cats[j]=x});render()},
 delcat(el){const i=+el.dataset.i,c0=pub.cats[i];if(pub.products.some(p=>p.cat===c0.id)){toast(t('cat_has_products'),true);return}applyBoth(c=>c.cats.splice(i,1));render()},
 addcoupon(){applyBoth(c=>c.store.coupons.push({code:'CUPOM'+(c.store.coupons.length+1),type:'pct',value:10,min:0,on:false}));render()},
 delcoupon(el){const i=+el.dataset.i;applyBoth(c=>c.store.coupons.splice(i,1));render()},
 newshop(){ui.ns={name:'',seg:'',plan:PL.plans[0].id,wa:'',domain:''};newShopSheet()},
 createshop(){const n=ui.ns;if(n.name.trim().length<2){document.getElementById('nsErr').textContent=t('err_shop_name');return}
  const base=slugify(n.name)||'loja';let id=base,k=2;while(PL.shops.some(x=>x.id===id))id=base+'-'+(k++);const p=PL.plans.find(x=>x.id===n.plan)||PL.plans[0];
  PL.shops.unshift({id,name:n.name.trim(),seg:P(n.seg.trim()||'—',n.seg.trim()||'—'),plan:p.id,due:isoDay(Date.now()+30*DAY),status:'ativo',domain:n.domain.trim().toLowerCase(),wa:n.wa.replace(/\D/g,''),pays:[{date:isoDay(Date.now()),v:p.price}]});
  savePL();closeSheet();render();toast(t('shop_created'))},
 shoppay(el){const x=PL.shops.find(z=>z.id===el.dataset.sid);if(!x)return;const base=Math.max(new Date(x.due+'T12:00:00').getTime(),Date.now());x.due=isoDay(base+30*DAY);x.status='ativo';x.pays.push({date:isoDay(Date.now()),v:planOf(x).price});savePL();render();toast(t('pay_ok'))},
 shopstatus(el){const x=PL.shops.find(z=>z.id===el.dataset.sid);if(!x)return;x.status='suspenso';savePL();render()},
 feemode(el){const m=el.dataset.m;applyBoth(c=>c.store.feeMode=m);render()},
 addbairro(){applyBoth(c=>c.store.bairros.push({name:'',fee:5000}));render()},
 delbairro(el){const i=+el.dataset.i;applyBoth(c=>c.store.bairros.splice(i,1));render()},
 copypix(){const k=pub.store.pixKey||'';try{navigator.clipboard.writeText(k).then(()=>toast(t('key_copied')),()=>{})}catch(e){}},
 copylink(){const v=CAT_URL;const ok=()=>toast(t('link_copied'));try{navigator.clipboard.writeText(v).then(ok,()=>{const i=document.getElementById('shareUrl');if(i){i.select()}})}catch(e){const i=document.getElementById('shareUrl');if(i)i.select()}},
 dlqr(){if(!window.qrMatrix){toast(t('qr_fail'),true);return}const c=document.createElement('canvas');c.width=c.height=720;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,720,720);x.imageSmoothingEnabled=false;x.drawImage(qrCanvas(720),0,0,720,720);saveData(c.toDataURL('image/png'),'qr-'+slugify(pub.store.name)+'.png')},
 dlposter(){if(!window.qrMatrix){toast(t('qr_fail'),true);return}poster(u=>saveData(u,'cartel-'+slugify(pub.store.name)+'.png'))},
 pcq(el){const i=+el.dataset.i,it=cart[i];if(!it)return;it.q+=(+el.dataset.d);if(it.q<1)cart.splice(i,1);saveCart();render()},
 upadd(el){const p=prod(pub,el.dataset.pid);if(!p)return;if((p.g||[]).length){productSheet(p.id);return}const key=p.id+'|{}|';const ex=cart.find(c=>c.key===key);if(ex)ex.q++;else cart.push({key,pid:p.id,q:1,o:{},note:''});saveCart();const open=!!document.querySelector('[data-ov]');render();if(open)cartSheet();toast('1x '+tr(p.n))},
 ticket(el){ticketSheet(el.dataset.no)},
 tkw(el){const w=+el.dataset.w;applyBoth(c=>c.store.ticketW=w);ticketSheet(ui.tkNo)},
 printtk(){printTicket(ui.tkNo)},
 showpw(){const i=document.getElementById('lg_pass');if(i)i.type=i.type==='password'?'text':'password'},
 logout(){S.set(K.auth,false);if(MODE==='panel'){ui.view='admin'}else{ui.view='catalog';history.replaceState(null,'','#catalogo')}render()},
 addad(){const a={adv:'',title:P('',''),sub:P('',''),link:'',color:'#1A1714',img:null,start:isoDay(Date.now()),end:isoDay(Date.now()+30*DAY),price:100000,on:false};applyBoth(c=>c.store.ads.unshift(clone(a)));render()},
 delad(el){const i=+el.dataset.i;applyBoth(c=>c.store.ads.splice(i,1));render()},
 adrmimg(el){const i=+el.dataset.i;applyBoth(c=>{if(c.store.ads[i])c.store.ads[i].img=null});render()},
 addslide(){draft.store.slides.push({title:P('',''),sub:P('',''),pid:'',color:draft.theme.primary,img:null});ui.state='dirty';ui.confirmPub=false;render()},
 delslide(el){draft.store.slides.splice(+el.dataset.i,1);ui.state='dirty';ui.confirmPub=false;render()},
 slmove(el){const a=draft.store.slides,i=+el.dataset.i,j=i+(+el.dataset.d);if(j<0||j>=a.length)return;const x=a[i];a[i]=a[j];a[j]=x;ui.state='dirty';ui.confirmPub=false;render()},
 slrmimg(el){draft.store.slides[+el.dataset.i].img=null;ui.state='dirty';ui.confirmPub=false;render()},
 delzone(el){const i=+el.dataset.i;applyBoth(c=>c.zones.splice(i,1));render()},
};
function selectMsg(){const el=document.getElementById('msgText');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener('click',e=>{if(e.target.matches('[data-ov]')){acts.close();return}const el=e.target.closest('[data-act]');if(!el||!el.dataset.act)return;if(el.closest('.pvframe'))return;acts[el.dataset.act]&&acts[el.dataset.act](el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('[data-ov]'))acts.close()});

/* ===== Campos ===== */
function onField(e){const el=e.target,d=el.dataset;
 if(el.id==='q'){ui.q=el.value;document.getElementById('secs').innerHTML=sectionsHTML(pub,true);return}
 if(d.pg){const p=prod(pub,pick.pid),g=p.g.find(x=>x.id===d.pg);let sel=g.type==='one'?[el.value]:[...document.querySelectorAll(`[data-pg="${g.id}"]:checked`)].map(i=>i.value);const mx=gMax(g,p,pick.o);if(g.type==='many'&&mx&&sel.length>mx)sel=sel.slice(0,mx);pick.o[g.id]=sel;(p.g||[]).forEach(x=>{const m2=gMax(x,p,pick.o);if(x.type==='many'&&m2&&(pick.o[x.id]||[]).length>m2)pick.o[x.id]=pick.o[x.id].slice(0,m2)});if(e.type==='change'||g.type==='one')renderProductSheet();else{const pt=document.getElementById('pTot');if(pt)pt.textContent=gs(lineUnit(pub,pick)*pick.q)}return}
 if(d.pnote){pick.note=el.value;return}
 if(d.ck){ck[d.ck]=el.value;if(e.type==='change'&&(d.re||d.ck==='zone'))checkoutSheet();return}
 if(d.th){draft.theme[d.th]=el.value;const c=document.getElementById('cv_'+d.th);if(c)c.textContent=el.value.toUpperCase();dirty();return}
 if(d.lay){draft.layout[d.lay]=el.checked;dirty();return}
 if(d.id){setPath(draft.store,d.id,el.value);dirty();return}
 if(d.sx){const k=d.sx;let v=el.type==='checkbox'?el.checked:el.value;if(k==='prep'||k==='minOrder')v=toInt(v);applyBoth(c=>c.store[k]=v);return}
 if(d.pay){applyBoth(c=>c.store.pay[d.pay]=el.checked);if(d.pay==='pix'&&e.type==='change')render();return}
 if(d.br!=null&&d.br!==''){const i=+d.br,f=d.f;const v=f==='fee'?toInt(el.value):el.value;applyBoth(c=>{if(c.store.bairros[i])c.store.bairros[i][f]=v});return}
 if(d.pp){const f=d.f;let v=el.type==='checkbox'?el.checked:toInt(el.value);applyBoth(c=>{const p=c.products.find(x=>x.id===d.pp);if(p)p[f]=v});return}
 if(d.zn!=null&&d.zn!==''){const i=+d.zn,f=d.f;let v=f==='name'?el.value:f==='km'?Math.max(0,parseFloat(String(el.value).replace(',','.'))||0):toInt(el.value);applyBoth(c=>{if(c.zones[i])c.zones[i][f]=v});return}
 if(d.eg!=null&&d.eg!==''){const g=ui.edit&&ui.edit.g[+d.eg];if(!g)return;if(d.f==='req')g.req=el.checked;else if(d.f==='type'){g.type=el.value;if(e.type==='change')editorSheet()}else if(d.f==='min'||d.f==='max')g[d.f]=toInt(el.value);else if(d.f==='bySize'){g.bySize=el.checked;if(e.type==='change')editorSheet()}else if(d.f==='price')g.price=el.value;else setPath(g,d.f,el.value);return}
 if(d.eo){const[gi,oi]=d.eo.split('.').map(Number);const o=ui.edit&&ui.edit.g[gi]&&ui.edit.g[gi].o[oi];if(!o)return;if(d.f==='p'||d.f==='max')o[d.f]=toInt(el.value);else setPath(o,d.f,el.value);return}
 if(d.cat!=null&&d.cat!==''){const i=+d.cat;applyBoth(c=>{if(c.cats[i])setPath(c.cats[i],d.f,el.value)});if(d.f==='i'&&e.type==='change')render();return}
 if(d.cp!=null&&d.cp!==''){const i=+d.cp,f=d.f;const v=f==='on'?el.checked:f==='code'?el.value.toUpperCase().replace(/\s/g,''):f==='type'?el.value:toInt(el.value);applyBoth(c=>{if(c.store.coupons[i])c.store.coupons[i][f]=v});if(f==='type'&&e.type==='change')render();return}
 if(d.day!=null&&d.day!==''){const i=+d.day,f=d.f;applyBoth(c=>{const dd=c.store.days[i];if(f==='on')dd.on=el.checked;else dd[f[0]][+f[1]]=el.value});if(f==='on'&&e.type==='change')render();return}
 if(d.ns){ui.ns[d.ns]=el.value;if(d.ns==='name'){const u=document.getElementById('nsUrl');if(u)u.textContent='tudelivery.com/'+(slugify(el.value)||'...')}return}
 if(d.shop){const x=PL.shops.find(z=>z.id===d.shop);if(x){x[d.f]=el.value;savePL();if(e.type==='change')render()}return}
 if(d.plan!=null&&d.plan!==''){const pp=PL.plans[+d.plan];if(pp){pp[d.f]=d.f==='n'?el.value:toInt(el.value);savePL()}return}
 if(d.ad!=null&&d.ad!==''){const i=+d.ad,f=d.f;const v=f==='on'?el.checked:f==='price'?toInt(el.value):el.value;applyBoth(c=>{const a=c.store.ads&&c.store.ads[i];if(a)setPath(a,f,v)});if(f==='color'){const c=el.parentElement.querySelector('code');if(c)c.textContent=el.value.toUpperCase()}if(e.type==='change'&&['on','start','end'].includes(f))render();return}
 if(d.sl!=null&&d.sl!==''){const x=draft.store.slides[+d.sl];if(!x)return;setPath(x,d.f,el.value);if(d.f==='color'){const c=el.parentElement.querySelector('code');if(c)c.textContent=el.value.toUpperCase()}dirty();return}
 if(d.ed){let v=el.value;if(d.ed==='price'||d.ed==='promo')v=toInt(v);setPath(ui.edit,d.ed,v);return}
 if(d.os&&e.type==='change'){const o=orders.find(x=>x.no===+d.os);if(o){o.status=el.value;S.set(K.orders,orders)}return}
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.adfile!=null&&el.files&&el.files[0]){const i=+el.dataset.adfile;resizeImg(el.files[0],1400,u=>{applyBoth(c=>{if(c.store.ads[i])c.store.ads[i].img=u});render()});return}
 if(el.dataset.slfile!=null&&el.files&&el.files[0]){const i=+el.dataset.slfile;resizeImg(el.files[0],1400,u=>{draft.store.slides[i].img=u;ui.state='dirty';render()});return}
 if(el.id==='coverFile'&&el.files[0]){resizeImg(el.files[0],1400,u=>{draft.store.cover=u;ui.state='dirty';render()});return}
 if(el.id==='logoFile'&&el.files[0]){resizeImg(el.files[0],256,u=>{draft.store.logo=u;ui.state='dirty';render()});return}
 if(el.id==='prodFile'&&el.files[0]){resizeImg(el.files[0],720,u=>{ui.edit.photo=u;editorSheet()});return}
 if(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT')onField(e);
 else if(el.dataset.ck&&el.dataset.re)onField(e);

document.addEventListener('submit',e=>{if(e.target.id!=='loginForm')return;e.preventDefault();const u=document.getElementById('lg_user').value.trim().toLowerCase(),pw=document.getElementById('lg_pass').value;
 if(u==='fogaomineiro'&&pw==='fogao2026'){S.set(K.auth,true);render();scrollTo(0,0)}else{document.getElementById('lgErr').textContent=t('login_err')}});
let spyRaf=0;window.addEventListener('scroll',()=>{if(spyRaf||ui.view!=='catalog')return;spyRaf=requestAnimationFrame(()=>{spyRaf=0;const nav=document.getElementById('cnav');if(!nav)return;const lim=nav.getBoundingClientRect().bottom+12;let cur=null;
 nav.querySelectorAll('a[data-c]').forEach(a=>{const sec=document.getElementById('sec-'+a.dataset.c);if(sec&&sec.getBoundingClientRect().top<=lim)cur=a});if(!cur)cur=nav.querySelector('a[data-c]');if(innerHeight+scrollY>=document.documentElement.scrollHeight-6){const all=nav.querySelectorAll('a[data-c]');cur=all[all.length-1]||cur}
 if(cur&&!cur.classList.contains('on')){nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a===cur));nav.scrollTo({left:Math.max(0,cur.offsetLeft-16),behavior:'smooth'})}})},{passive:true});
window.addEventListener('hashchange',()=>{if(MODE!=='demo')return;const v=viewFromHash();if(v!==ui.view){ui.view=v;closeSheet();render()}});
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--topH',document.getElementById('top').offsetHeight+'px'));
