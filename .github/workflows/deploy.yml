name: Publicar no site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Enviar arquivos para fogaomineiro.araujotechsistemas.com
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u "$FTP_USERNAME" ftp://$FTP_SERVER;
            mirror --reverse --verbose --only-newer --parallel=3 \
              --exclude-glob .git* --exclude-glob .git/ --exclude-glob .github/ --exclude-glob README.md \
              ./ ./;
            bye"
